<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ChatGPT Web Bridge</title>
<style>
body{font-family:Arial,sans-serif;width:300px;padding:16px;margin:0}
h3{margin:0 0 12px}
.status{padding:10px;border-radius:8px;background:#f1f5f9;margin-bottom:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:6px}
button{width:100%;padding:9px;border:0;border-radius:7px;cursor:pointer}
small{color:#64748b}
</style>
</head>
<body>
<h3>ChatGPT Web Bridge</h3>
<div class="status"><span id="dot" class="dot"></span><span id="status">Verificando...</span></div>
<small id="server"></small>
<p><button id="options">Configurações</button></p>
<hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0;">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
  <strong>Logs Recentes</strong>
  <span id="clearLogs" style="cursor:pointer;color:#2563eb;font-size:11px;">Limpar</span>
</div>
<div id="logs" style="max-height:160px;overflow-y:auto;background:#0f172a;color:#f8fafc;font-family:monospace;font-size:10px;padding:8px;border-radius:6px;word-break:break-all;"></div>
<script src="popup.js"></script>
</body>
</html>
